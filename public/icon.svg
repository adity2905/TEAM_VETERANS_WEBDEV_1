<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="50%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#0d9488"/>
    </linearGradient>
    <linearGradient id="innerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#d1fae5"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#059669" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Outer Shield Badge -->
  <path d="M32 4L10 14V30C10 44 19.5 56.5 32 60C44.5 56.5 54 44 54 30V14L32 4Z" 
        fill="url(#shieldGrad)" 
        filter="url(#glow)"/>
        
  <!-- Inner White Emblem Shield -->
  <path d="M32 9L15 17V30C15 41.5 22.5 52 32 55C41.5 52 49 41.5 49 30V17L32 9Z" 
        fill="none" 
        stroke="rgba(255,255,255,0.4)" 
        stroke-width="1.5"/>

  <!-- Bold 'T' for Transparency with Heart & Check Integration -->
  <path d="M22 22H42V28H35V46H29V28H22V22Z" fill="url(#innerGrad)"/>
  
  <!-- Emerald Verification Star/Sparkle -->
  <circle cx="43" cy="20" r="3.5" fill="#34d399"/>
</svg>
